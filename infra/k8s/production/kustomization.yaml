apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meridian

# List style and image ordering below match what `kustomize edit` writes back.
# CI rewrites this file on every push to main, and if the checked-in form
# differed the first commit would reindent everything and bury the one line that
# actually changed.
# web-*.yaml carry the workload named `meridian-app`: the file name follows the
# source directory (apps/web), the workload name follows the public surface
# (meridian-app.madfam.io). See web-deployment.yaml.
resources:
- namespace.yaml
- api-deployment.yaml
- api-service.yaml
- web-deployment.yaml
- web-service.yaml
- admin-deployment.yaml
- admin-service.yaml
- landing-deployment.yaml
- landing-service.yaml

# secrets-template.yaml is deliberately NOT a resource. It documents the key
# names this namespace needs; the Secret itself is provisioned by the operator
# and never rendered from git.

# CI replaces each `newTag` here with the digest of the image it just built and
# signed:
#
#   kustomize edit set image \
#     ghcr.io/madfam-org/meridian-api=ghcr.io/madfam-org/meridian-api@sha256:...
#
# The `main` tags are the bootstrap value, valid only until that first run. A tag
# is a mutable pointer — two syncs of `:main` can deliver different bytes and
# ArgoCD cannot tell one from the other — so nothing should stay pinned to a tag
# once the pipeline has run.
#
# Two path shapes coexist here. The first three predate the landing split and use
# `madfam-org/meridian-<part>`; the landing image uses `madfam-org/meridian/<part>`,
# the nested form Avala and Enclii already publish under. Renaming the existing
# three to match would orphan their GHCR packages and reset three pinned digests
# for images whose bytes did not change, so they stay as they are.
#
# The landing entry goes last because `kustomize edit set image` rewrites the
# entries it recognises in place and appends anything new to the end. Writing it
# anywhere else means the first CI run moves it, and that reordering commit
# lands on top of the digest change it was supposed to be.
images:
- digest: sha256:22bb96935d514ee86e0ecbed15aaeffd937536852ed318745741268d6326addd
  name: ghcr.io/madfam-org/meridian-admin
  newName: ghcr.io/madfam-org/meridian-admin
- digest: sha256:c74ca521a68853802365d02f5fc3514025ab5006d3a548f0b806cce590d6c046
  name: ghcr.io/madfam-org/meridian-api
  newName: ghcr.io/madfam-org/meridian-api
- digest: sha256:8442102acbddaea56cd403c3afdd0364c2e7c364dfde51effd521e414d0ff9a6
  name: ghcr.io/madfam-org/meridian-web
  newName: ghcr.io/madfam-org/meridian-web
- digest: sha256:cae50d5795dd7676e6a19a3f8bdd6da69861c3f51ef410d32255faa76c93b2fe
  name: ghcr.io/madfam-org/meridian/landing
  newName: ghcr.io/madfam-org/meridian/landing
