# Meridian — required Secret keys.
#
# This file documents KEY NAMES. It contains no values, and it deliberately
# contains no Secret manifest either.
#
# A skeleton manifest with empty strings would be worse than nothing: it creates
# `meridian-secrets`, every `secretKeyRef` resolves, the pods start, and the API
# opens a connection pool against an empty connection string. The failure then
# arrives during a request instead of at scheduling time, and it looks like an
# application bug rather than a missing secret. A pod stuck in
# CreateContainerConfigError with `secret "meridian-secrets" not found` is the
# clearer outcome.
#
# ---------------------------------------------------------------------------
# Secret: meridian-secrets  (namespace: meridian)
# ---------------------------------------------------------------------------
#
# REQUIRED — meridian-api does not start without it:
#
#   database-url
#       Postgres connection string for the matter store. Provisioned as this
#       service's own database, not a shared one: it holds travel-document
#       numbers, dates of birth, and day-by-day presence histories, and those do
#       not belong in a database another service can read. Consumed as
#       DATABASE_URL (see api-deployment.yaml).
#
# OPTIONAL — the services run without these; add the key and the matching env
# reference in the same change, never one without the other:
#
#   janua-client-secret
#       Only when the browser apps move to a confidential OIDC client. The API
#       verifies tokens against the published JWKS and needs no client secret.
#
#   sentry-dsn
#       Error reporting. Note before enabling: a stack trace from this codebase
#       can carry an applicant's document number or presence dates in a local
#       variable, so scrubbing has to be configured before the first event is
#       sent, not after.
#
# ---------------------------------------------------------------------------
# Services that need nothing from this Secret
# ---------------------------------------------------------------------------
#
# meridian-landing (meridian.madfam.io) reads no key here, and no key was added
# for it. The public explainer serves copy from its own bundle: no database, no
# API call, no session, nothing to authenticate as. Stating that is the point —
# an unused key provisioned "for later" is a credential mounted into a pod that
# has no reason to hold one, and it is the pod most exposed to the internet.
#
# meridian-app and meridian-admin read no key either; their configuration is
# public endpoints, inlined at build time.
#
# ---------------------------------------------------------------------------
# Provisioning
# ---------------------------------------------------------------------------
#
# Through the platform, not kubectl:
#
#   enclii secrets set --project meridian --service meridian-api database-url
#
# The command prompts for the value; it is not passed as an argument, so it does
# not land in shell history or in the process list. When Vault is live this file
# is replaced by an ExternalSecret pointing at `secret/meridian` — see
# internal-devops/ecosystem/deployment-conventions.md.
#
# ---------------------------------------------------------------------------
# What is NOT here, and will not be
# ---------------------------------------------------------------------------
#
# No key on this list holds a government authentication credential. Meridian
# does not sign in to a government portal as a user, and it does not hold what
# would be needed to try: no Spanish electronic-identity PIN, no Mexican
# e.firma or FIEL private key, no stored portal or immigration-account password
# for anyone.
#
# This is a refusal, not an unfinished integration. Those credentials are the
# person's own legal identity; custody of them transfers the ability to act as
# that person, and no amount of encryption at rest gives it back. Where a
# government step genuinely needs the applicant, Meridian produces an assisted
# handoff — the exact steps, the documents to bring, the field values already
# computed — and the person performs it themselves. The design and its reasoning
# are in packages/govtech/src/credential-guard.ts, the type system enforces it
# inside that package, and scripts/check-no-credential-custody.mjs fails CI if a
# key like that ever appears in this repository.
#
# If a future integration appears to require one, that is the signal to open the
# question with counsel and the platform team, not to add a key here.
