apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-api
  namespace: meridian
  labels:
    app: meridian-api
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-api
  template:
    metadata:
      labels:
        app: meridian-api
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: api
          # Immutable digest, rewritten in place by the `Pin image digests` step
          # of .github/workflows/build-deploy.yml on every push to main.
          #
          # The digest lives here as well as in kustomization.yaml's `images:`
          # block because readers of this file are not all kustomize. The
          # onboarding gate fetches this manifest raw from GitHub, applies no
          # overlay, and treats any reference that is not `@sha256:` as a
          # blocker — so a `:main` tag here fails the gate even when the
          # rendered output would have been correct. The two must be kept in
          # step; CI writes both in the same commit.
          image: ghcr.io/madfam-org/meridian-api@sha256:c74ca521a68853802365d02f5fc3514025ab5006d3a548f0b806cce590d6c046
          ports:
            - name: http
              containerPort: 8000
          env:
            # Pinned here as well as in enclii.yaml so the production posture
            # does not depend on what the Secret happens to carry.
            - name: MERIDIAN_ENV
              value: production
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8000"
            - name: HOST
              value: 0.0.0.0
            - name: JANUA_URL
              value: "https://auth.madfam.io"
            - name: JANUA_JWKS_URL
              value: "https://auth.madfam.io/.well-known/jwks.json"
            # Expected `iss`. Janua is single-issuer per deployment — the value
            # is derived from Janua's own configured domain and never from the
            # request Host — so there is exactly one correct value for the whole
            # ecosystem, and it is the origin the JWKS above is served from.
            - name: JANUA_ISSUER
              value: "https://auth.madfam.io"
            # Expected `aud`, and the reason a token minted for a neighbouring
            # service in the same realm cannot authenticate here.
            #
            # THIS MUST EQUAL THE CLIENT IDENTIFIER REGISTERED FOR THIS API IN
            # JANUA, CHARACTER FOR CHARACTER. A mismatch fails every
            # verification closed: apps/api/src/auth/verifier.ts refuses with
            # `wrong_audience` and tells the caller only that the token was not
            # accepted, so the symptom is "every request is 401" rather than
            # anything that names configuration.
            #
            # No such registration exists yet. `meridian-api` is a claim about
            # one that has to be made before this deployment can authenticate
            # anybody — register the API under this identifier, and mint the
            # portal's and console's tokens with it in `aud`. This line and the
            # matching line in enclii.yaml are the only two places the value
            # appears; move both in the commit that performs the registration.
            - name: JANUA_AUDIENCE
              value: "meridian-api"
            # CORS allow-list, explicit and never a wildcard: these responses
            # carry an applicant's own documents. `meridian.madfam.io` is absent
            # on purpose — that host is the landing site now, and it makes no
            # API call.
            #
            # CORS_ALLOWED_ORIGINS is the name apps/api/src/config.ts reads, and
            # it is required; the API refuses to start without it rather than
            # falling back to something permissive. The MERIDIAN_*_ORIGIN pair
            # are the per-surface names SECURITY.md documents. All three carry
            # the same fact and have to move together.
            - name: CORS_ALLOWED_ORIGINS
              value: "https://meridian-app.madfam.io,https://meridian-admin.madfam.io"
            - name: MERIDIAN_WEB_ORIGIN
              value: "https://meridian-app.madfam.io"
            - name: MERIDIAN_ADMIN_ORIGIN
              value: "https://meridian-admin.madfam.io"
            # The only secret this service reads. Referenced by name; the value
            # is provisioned by the operator and never appears in git.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: database-url
            # Node writes transient files under TMPDIR. The root filesystem is
            # read-only, so it is pointed at the emptyDir mounted below.
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            # `privileged: false` is spelled out rather than left to the
            # default. The cluster's disallow-privileged-containers policy runs
            # in Enforce and requires the field to be *present* — "absent" and
            # "false" mean the same thing to the kubelet and different things to
            # the admission webhook, so a manifest that omits it is rejected at
            # apply time with no workload ever created. This exact omission
            # blocked a previous service's go-live; all four Meridian
            # Deployments carry the field for that reason.
            #
            # The rest of the baseline set is already satisfied and is not
            # repeated here: `runAsNonRoot`, `runAsUser`/`runAsGroup` and
            # `seccompProfile` sit on the pod securityContext above,
            # `capabilities.drop: [ALL]` and `allowPrivilegeEscalation` are
            # below, and no pod in this namespace requests a host namespace, a
            # hostPath volume or a host port.
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # A cold start compiles nothing and opens one connection pool, but a
          # slow database makes the first readiness attempt fail. The startup
          # probe absorbs that without letting the liveness probe restart a pod
          # that is merely waiting.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is deep — `/health/ready` actually calls Postgres — so a
          # pod that loses its store leaves the Service instead of returning
          # 500s. It answers 503 when a dependency fails, which is what makes
          # this probe worth having; a readiness endpoint that returns 200
          # unconditionally removes the signal while looking like it provides it.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness is shallow on purpose. A database blip must not kill a
          # process midway through writing a matter's presence ledger; that is a
          # record of where a person was, and a torn write is worse than a slow
          # response.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
