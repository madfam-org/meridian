# The public explainer — apps/landing, built by Dockerfile.landing, served at
# meridian.madfam.io.
#
# This is the only Meridian surface a person reaches without an account, so it
# is also the only one that has to be legible to someone deciding whether to
# hand over a passport number at all. It reads no database, verifies no token
# and calls no API; everything it needs is in its own bundle. Keep it that way —
# the moment this pod needs a credential, it stops being the page anyone can
# safely be sent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-landing
  namespace: meridian
  labels:
    app: meridian-landing
    app.kubernetes.io/part-of: madfam-platform
spec:
  # Two replicas so a rollout is not a front door that answers nothing. Not a
  # capacity decision: this site serves static-shaped pages.
  replicas: 2
  selector:
    matchLabels:
      app: meridian-landing
  template:
    metadata:
      labels:
        app: meridian-landing
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: landing
          # Immutable digest, rewritten in place by the `Pin image digests` step
          # of .github/workflows/build-deploy.yml. See api-deployment.yaml for
          # why the digest is written here and not only in kustomization.yaml.
          #
          # Note the nested path: this image is `madfam-org/meridian/landing`,
          # while the other three are flat `madfam-org/meridian-<part>`. The
          # split is explained in kustomization.yaml.
          image: ghcr.io/madfam-org/meridian/landing@sha256:cae50d5795dd7676e6a19a3f8bdd6da69861c3f51ef410d32255faa76c93b2fe
          ports:
            - name: http
              containerPort: 3000
          # NEXT_PUBLIC_APP_URL used to be declared here as the portal address
          # for the sign-in link. Nothing read it: apps/landing takes every
          # outbound URL from apps/landing/lib/links.ts, where a reviewer can
          # see it, and `grep -rn NEXT_PUBLIC apps packages` matches nothing. A
          # variable that looks like it steers the one link that matters, and
          # does not, is worse than no variable — so it is gone rather than
          # kept "for later".
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            # Present, not merely not-true: the disallow-privileged-containers
            # policy is in Enforce and rejects a container that omits the field.
            # See api-deployment.yaml.
            privileged: false
            allowPrivilegeEscalation: false
            # See web-deployment.yaml — Next writes its caches under .next/cache
            # at runtime, so the root filesystem cannot be sealed without an
            # emptyDir pinned to a path that moves with the app layout.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # `/` rather than `/api/health` — see web-deployment.yaml. apps/landing
          # has no health route, and a probe pointed at an endpoint nobody wrote
          # is a deployment that never becomes ready. On this app the cost is
          # low: `/` is the page it exists to serve.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
