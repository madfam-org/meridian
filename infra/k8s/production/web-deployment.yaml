# The applicant portal — apps/web, built by Dockerfile.web, served at
# meridian-app.madfam.io.
#
# The workload is named for the surface (`meridian-app`) while the file, the
# image and the source directory stay `web`. Renaming the package and the
# directory would touch every import in the repository to change a hostname.
#
# `app:` is a selector, not a decoration: a Deployment whose selector no longer
# matches its own pod template creates a second ReplicaSet and orphans the
# running pods, which stay up serving old code with nothing managing them. All
# four occurrences below move together or none of them do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-app
  namespace: meridian
  labels:
    app: meridian-app
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-app
  template:
    metadata:
      labels:
        app: meridian-app
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          # Image name unchanged: it identifies the artifact built from
          # apps/web, and repointing it would reset the digest CI has already
          # pinned in kustomization.yaml for a build whose bytes did not change.
          image: ghcr.io/madfam-org/meridian-web:main
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # Next inlines NEXT_PUBLIC_* into the client bundle at build time.
            # These runtime copies are what server components read, so they must
            # match the --build-arg values in build-deploy.yml — a mismatch
            # produces a page whose client and server disagree about where the
            # API lives.
            - name: NEXT_PUBLIC_API_URL
              value: "https://meridian-api.madfam.io"
            - name: NEXT_PUBLIC_JANUA_URL
              value: "https://auth.madfam.io"
            # Still `meridian-web` — the identifier registered with Janua. See
            # enclii.yaml: renaming it before the new client exists there fails
            # every sign-in.
            - name: NEXT_PUBLIC_JANUA_CLIENT_ID
              value: "meridian-web"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Next writes its fetch and route caches under .next/cache at
            # runtime. Locking the filesystem would need an emptyDir mounted at
            # a path that moves with the app's directory layout, which is a
            # sharper edge than the one it removes.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # Probing `/` because that is a route this application actually has.
          # There is no `/api/health` handler in apps/web yet, and a probe
          # pointed at one would leave every pod permanently unready — a
          # deployment that never rolls out, caused by a health check for an
          # endpoint nobody wrote.
          #
          # It is a heavier probe than a dedicated handler: it renders the home
          # page each time. Move all three to `/api/health` when that route
          # exists, in the same change that adds it.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
