# The applicant portal — apps/web, built by Dockerfile.web, served at
# meridian-app.madfam.io.
#
# The workload is named for the surface (`meridian-app`) while the file, the
# image and the source directory stay `web`. Renaming the package and the
# directory would touch every import in the repository to change a hostname.
#
# `app:` is a selector, not a decoration: a Deployment whose selector no longer
# matches its own pod template creates a second ReplicaSet and orphans the
# running pods, which stay up serving old code with nothing managing them. All
# four occurrences below move together or none of them do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-app
  namespace: meridian
  labels:
    app: meridian-app
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-app
  template:
    metadata:
      labels:
        app: meridian-app
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          # Image name unchanged: it identifies the artifact built from
          # apps/web, and repointing it would reset the digest CI has already
          # pinned for a build whose bytes did not change.
          #
          # Immutable digest, rewritten in place by the `Pin image digests` step
          # of .github/workflows/build-deploy.yml. See api-deployment.yaml for
          # why the digest is written here and not only in kustomization.yaml.
          image: ghcr.io/madfam-org/meridian-web@sha256:6db05b27af2d0a6d3f6902d41c48c8a299275fa35c28047e47f98f6e5f5c65ad
          ports:
            - name: http
              containerPort: 3000
          # Three variables, all of which this container's process actually
          # reads. The `NEXT_PUBLIC_*` set that used to sit here — API URL,
          # Janua URL, Janua client id — was removed: `grep -rn NEXT_PUBLIC apps
          # packages` matches nothing, so declaring them described a wiring that
          # did not exist and told the next reader the portal was already
          # talking to the API. Add them back in the change that adds the code
          # reading them, together with the matching --build-arg, and not before.
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            # Present, not merely not-true: the disallow-privileged-containers
            # policy is in Enforce and rejects a container that omits the field.
            # See api-deployment.yaml.
            privileged: false
            allowPrivilegeEscalation: false
            # Next writes its fetch and route caches under .next/cache at
            # runtime. Locking the filesystem would need an emptyDir mounted at
            # a path that moves with the app's directory layout, which is a
            # sharper edge than the one it removes.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # Probing `/` because that is a route this application actually has.
          # There is no `/api/health` handler in apps/web yet, and a probe
          # pointed at one would leave every pod permanently unready — a
          # deployment that never rolls out, caused by a health check for an
          # endpoint nobody wrote.
          #
          # It is a heavier probe than a dedicated handler: it renders the home
          # page each time. Move all three to `/api/health` when that route
          # exists, in the same change that adds it.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
