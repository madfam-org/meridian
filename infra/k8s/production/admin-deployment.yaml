apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-admin
  namespace: meridian
  labels:
    app: meridian-admin
    app.kubernetes.io/part-of: madfam-platform
spec:
  # Two replicas is not a capacity decision — this console is small. It is so a
  # rollout is not an outage of the surface where a licensed representative
  # signs off on catalog records and takes responsibility for advice.
  replicas: 2
  selector:
    matchLabels:
      app: meridian-admin
  template:
    metadata:
      labels:
        app: meridian-admin
        app.kubernetes.io/part-of: madfam-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: admin
          # Immutable digest, rewritten in place by the `Pin image digests` step
          # of .github/workflows/build-deploy.yml. See api-deployment.yaml for
          # why the digest is written here and not only in kustomization.yaml.
          image: ghcr.io/madfam-org/meridian-admin@sha256:c173f55fbd617d57645503c6fcab501efcaf651eaccd2aeb298decc5afa34cef
          ports:
            - name: http
              containerPort: 3000
          # No NEXT_PUBLIC_* here; see web-deployment.yaml. Nothing in apps/
          # or packages/ reads one, so declaring them documented a wiring that
          # does not exist.
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            # Present, not merely not-true: the disallow-privileged-containers
            # policy is in Enforce and rejects a container that omits the field.
            # See api-deployment.yaml.
            privileged: false
            allowPrivilegeEscalation: false
            # See web-deployment.yaml — Next writes its caches at runtime.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # `/` rather than `/api/health` — see web-deployment.yaml. apps/admin
          # has no health route, and probing one that does not exist is a
          # deployment that never becomes ready.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
