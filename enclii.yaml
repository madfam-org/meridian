# Meridian — Enclii service definitions.
#
# Five documents:
#   1. the project-level record (status-page entries + the network block),
#   2-5. one Service per deployable: meridian-api, meridian-app,
#        meridian-landing, meridian-admin.
#
# The public front door and the applicant portal are two different services.
# `meridian.madfam.io` is the explainer anyone can read before they trust us with
# a passport number; `meridian-app.madfam.io` is the portal they sign in to. Avala
# runs the same split (avala.studio marketing, app.avala.studio application), as
# does Pravara MES.
#
# Domains are declared once, on the service that owns them. They deliberately do
# NOT nest: `meridian-api.madfam.io`, not `api.meridian.madfam.io`. Cloudflare's
# universal certificate covers `*.madfam.io` but not `*.*.madfam.io`, so a nested
# host serves a certificate error to every visitor. Pravara MES hit exactly this
# and the flat pattern is what came out of it. It is also why the portal is
# `meridian-app.madfam.io` and not `app.meridian.madfam.io` — Avala can nest one
# level because it owns its own apex domain, and Meridian does not.
#
# Secrets appear here only as `secretKeyRef` name/key pairs. No value, and no
# placeholder shaped like a value — this repository is public. The key names are
# documented in infra/k8s/production/secrets-template.yaml and provisioned by the
# operator with `enclii secrets set`.

apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: meridian
  project: meridian
  description: "Meridian — global migration law and logistics platform"

spec:
  status:
    enabled: true
    entries:
      - name: Meridian Landing
        url: https://meridian.madfam.io
        group: Meridian
        family: MADFAM Platform
        description: Public explainer — what the platform does, and what it refuses to do
      - name: Meridian App
        url: https://meridian-app.madfam.io
        group: Meridian
        family: MADFAM Platform
        description: Applicant portal — a migrant's view of their own matter
      - name: Meridian API
        url: https://meridian-api.madfam.io/health
        href: https://meridian-api.madfam.io
        group: Meridian
        family: MADFAM Platform
        description: Presence, documents, pathways, and the advice-boundary gate
      - name: Meridian Admin
        url: https://meridian-admin.madfam.io
        href: https://meridian-admin.madfam.io
        group: Meridian
        family: MADFAM Platform
        description: Firm console — caseload, representative assignment, catalog review

  # The control plane generates NetworkPolicies from this block and applies them
  # via the K8s API; they are not committed to git (see
  # internal-devops/ecosystem/deployment-conventions.md).
  #
  # `ports:` in a generated policy must intersect the pods' containerPorts or the
  # CNI drops the traffic silently, so the port numbers below are the same ones
  # the Deployments expose: 8000 / 3000 / 3000 / 3000.
  network:
    services:
      - name: meridian-api
        port: 8000
        ingress: [cloudflare-tunnel]
        # postgres: the matter store. janua: JWKS fetch for token verification.
        # https: government reference material and ecosystem edges. No egress is
        # opened to any government authentication endpoint, because Meridian does
        # not authenticate as a user anywhere — see packages/govtech.
        egress: [dns, https, postgres, janua]
      - name: meridian-app
        port: 3000
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: meridian-landing
        port: 3000
        ingress: [cloudflare-tunnel]
        # dns only. The landing site renders no external data, holds no API
        # client and signs nobody in, so it has nothing to call. If a server-side
        # fetch is ever added, add `https` here in the same change — a policy
        # that does not list the port drops the connection with no error anyone
        # can see, and it presents as a rendering bug rather than a network one.
        egress: [dns]
      - name: meridian-admin
        port: 3000
        ingress: [cloudflare-tunnel]
        egress: [dns, https]

---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: meridian-api
  project: meridian
  description: "Meridian API — matters, presence, documents, pathways, and the disclosure gate"

spec:
  build:
    type: dockerfile
    dockerfile: Dockerfile.api
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/meridian
        branch: main
        autoDeploy: true

  runtime:
    port: 8000
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    healthCheck: /health
    # Readiness is deep (`/health/ready` reaches the database) so a pod that
    # loses its store leaves rotation instead of returning 500s. Liveness stays
    # shallow on `/health`: a database blip must not kill a process midway
    # through writing a matter's presence ledger.
    readinessProbe:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 30

  env:
    - name: MERIDIAN_ENV
      value: production
    - name: PORT
      value: "8000"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: meridian-secrets
          key: database-url
    - name: JANUA_URL
      value: "https://auth.madfam.io"
    - name: JANUA_JWKS_URL
      value: "https://auth.madfam.io/.well-known/jwks.json"
    # CORS allow-list. Both browsers that may call this API are ours; anything
    # else is refused rather than reflected back. An explicit list, never a
    # wildcard: these responses carry an applicant's own documents.
    #
    # `https://meridian.madfam.io` is deliberately NOT on the list. That host is
    # now the landing site, which makes no API call at all; a marketing page on
    # the allow-list is standing permission nothing needs.
    #
    # CORS_ALLOWED_ORIGINS is the variable apps/api/src/config.ts actually reads,
    # and it is required — the API refuses to start without it rather than
    # defaulting to something permissive. The two MERIDIAN_*_ORIGIN entries below
    # are the per-surface names SECURITY.md documents; keep all three in step.
    - name: CORS_ALLOWED_ORIGINS
      value: "https://meridian-app.madfam.io,https://meridian-admin.madfam.io"
    - name: MERIDIAN_WEB_ORIGIN
      value: "https://meridian-app.madfam.io"
    - name: MERIDIAN_ADMIN_ORIGIN
      value: "https://meridian-admin.madfam.io"

  domains:
    - domain: meridian-api.madfam.io
      tls: true
      tlsIssuer: cloudflare

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  slo:
    availability: 99.9
    latencyP95: 300
    errorRate: 0.5

---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  # Named for the surface it serves, not for the directory it is built from. The
  # workspace package stays `@meridian/web` and the source stays `apps/web`;
  # only the deployed service and its hostname move. Avala does the same —
  # `avala-web` is the application, `avala-landing` is the marketing site.
  name: meridian-app
  project: meridian
  description: "Meridian App — applicant portal, where a migrant signs in to their own matter"

spec:
  build:
    type: dockerfile
    dockerfile: Dockerfile.web
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/meridian
        branch: main
        autoDeploy: true

  runtime:
    port: 3000
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # `/` because apps/web and apps/admin have no health route; probing one
    # that does not exist keeps every pod unready. See
    # infra/k8s/production/web-deployment.yaml.
    healthCheck: /

  env:
    # Next inlines NEXT_PUBLIC_* at build time, so these are also passed as
    # --build-arg in .github/workflows/build-deploy.yml. Keeping them here too
    # documents the runtime contract and keeps the two in one diff.
    - name: NEXT_PUBLIC_API_URL
      value: "https://meridian-api.madfam.io"
    - name: NEXT_PUBLIC_JANUA_URL
      value: "https://auth.madfam.io"
    # Still `meridian-web`. This is the client's registered identifier in Janua,
    # not a label we own: changing it here without registering the new client
    # first fails every sign-in with an unknown-client error. Rename it in the
    # change that registers it, not in this one.
    - name: NEXT_PUBLIC_JANUA_CLIENT_ID
      value: "meridian-web"

  domains:
    - domain: meridian-app.madfam.io
      tls: true
      tlsIssuer: cloudflare

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  slo:
    availability: 99.9
    latencyP95: 200
    errorRate: 0.5

---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: meridian-landing
  project: meridian
  description: "Meridian Landing — public explainer for the platform"

spec:
  build:
    type: dockerfile
    dockerfile: Dockerfile.landing
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/meridian
        branch: main
        autoDeploy: true

  runtime:
    port: 3000
    # Two replicas is not a capacity decision either. This is the hostname a
    # person reaches first, often from a link someone sent them, and a rollout
    # of a single replica is a front door that briefly answers nothing.
    replicas: 2
    # Smaller than the portal on purpose: this service renders marketing copy
    # from its own bundle. It opens no database connection, verifies no token
    # and holds no applicant data, so the working set is a Next server and its
    # rendered pages.
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "384Mi"
    # `/` for the same reason as the portal and the console: apps/landing has no
    # health route, and a probe pointed at one that does not exist keeps every
    # pod unready forever. See infra/k8s/production/landing-deployment.yaml.
    healthCheck: /

  env:
    # The landing site's only outward dependency is knowing where the portal
    # lives, for the sign-in link. Next inlines NEXT_PUBLIC_* at build time, so
    # this is also passed as --build-arg in
    # .github/workflows/build-deploy.yml. No API URL and no Janua client: this
    # site calls nothing and signs nobody in — that is what makes it safe to
    # serve to anyone.
    - name: NEXT_PUBLIC_APP_URL
      value: "https://meridian-app.madfam.io"

  domains:
    - domain: meridian.madfam.io
      tls: true
      tlsIssuer: cloudflare

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  slo:
    availability: 99.9
    latencyP95: 200
    errorRate: 0.5

---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: meridian-admin
  project: meridian
  description: "Meridian Admin — firm console for licensed representatives"

spec:
  build:
    type: dockerfile
    dockerfile: Dockerfile.admin
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/meridian
        branch: main
        autoDeploy: true

  runtime:
    port: 3000
    # Two replicas, not because of load — this console is small — but because a
    # single replica means a rollout is an outage, and the console is where a
    # licensed representative signs off on catalog records.
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # `/` because apps/web and apps/admin have no health route; probing one
    # that does not exist keeps every pod unready. See
    # infra/k8s/production/web-deployment.yaml.
    healthCheck: /

  env:
    - name: NEXT_PUBLIC_API_URL
      value: "https://meridian-api.madfam.io"
    - name: NEXT_PUBLIC_JANUA_URL
      value: "https://auth.madfam.io"
    - name: NEXT_PUBLIC_JANUA_CLIENT_ID
      value: "meridian-admin"

  domains:
    - domain: meridian-admin.madfam.io
      tls: true
      tlsIssuer: cloudflare

  autoscaling:
    enabled: false

  slo:
    availability: 99.5
    latencyP95: 300
    errorRate: 0.5
