name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, push, and pin image digests
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      # contents: write — the digest commit back to main (see the last step).
      # packages: write — push to GHCR.
      # id-token: write — cosign keyless signing; no signing key is stored.
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installed by direct download rather than sigstore/cosign-installer: the
      # action's install script shells out to `envsubst`, which the minimal ARC
      # runner image does not carry. The checksum file comes from the same
      # release, so the binary verifies itself before it is trusted.
      - name: Install cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.6.0
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSfL -o /tmp/cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          expected="$(grep ' cosign-linux-amd64$' /tmp/cosign_checksums.txt | awk '{print $1}')"
          echo "${expected}  $HOME/.local/bin/cosign" | sha256sum -c -
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Base images are pulled from Docker Hub anonymously. A busy runner pool
      # can exhaust the anonymous pull allowance; the fix is a docker.io login
      # step before buildx starts, which needs a registry credential this public
      # repository does not currently hold.
      - name: Build and push api
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/madfam-org/meridian-api:${{ github.sha }}
            ghcr.io/madfam-org/meridian-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/madfam-org/meridian-web:${{ github.sha }}
            ghcr.io/madfam-org/meridian-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # No build arguments. The three NEXT_PUBLIC_* values passed here were
          # read by no line of source in apps/ or packages/, so they were inlined
          # into a publicly pullable image to be used by nothing. Dockerfile.web
          # no longer declares the matching ARGs; restore both sides together, in
          # the change that adds the code reading them.

      - name: Build and push admin
        id: build-admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: |
            ghcr.io/madfam-org/meridian-admin:${{ github.sha }}
            ghcr.io/madfam-org/meridian-admin:main
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          # No build arguments; see the web step above.

      # The public explainer at meridian.madfam.io, and the least sensitive of
      # the four images: no API URL, no Janua client id, nothing inlined at all.
      # The `NEXT_PUBLIC_APP_URL` build argument this step used to pass named no
      # ARG in Dockerfile.landing, so BuildKit discarded it — the portal address
      # comes from apps/landing/lib/links.ts.
      - name: Build and push landing
        id: build-landing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.landing
          push: true
          tags: |
            ghcr.io/madfam-org/meridian/landing:${{ github.sha }}
            ghcr.io/madfam-org/meridian/landing:main
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

      # Keyless signing through the workflow's OIDC identity — no key material
      # exists to leak. The signature is a public transparency-log record that
      # these digests were produced by this workflow in this repository.
      #
      # The cluster does not enforce verification yet: turning that on is an
      # operator change (the `enclii.dev/verify-signatures` namespace label plus
      # a policy controller configured with the accepted identity), and enabling
      # it from here without the matching cluster side would stop every pull.
      - name: Sign images
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          set -euo pipefail

          sign_image() {
            image="$1"
            for attempt in 1 2 3; do
              if cosign sign --yes "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "cosign failed after ${attempt} attempts for ${image}" >&2
                return 1
              fi
              sleep $((attempt * 20))
            done
          }

          sign_image "ghcr.io/madfam-org/meridian-api@${{ steps.build-api.outputs.digest }}"
          sign_image "ghcr.io/madfam-org/meridian-web@${{ steps.build-web.outputs.digest }}"
          sign_image "ghcr.io/madfam-org/meridian-admin@${{ steps.build-admin.outputs.digest }}"
          sign_image "ghcr.io/madfam-org/meridian/landing@${{ steps.build-landing.outputs.digest }}"

      # Same self-verifying download pattern as cosign above. The version is
      # pinned so a kustomize release cannot change the shape of the manifest
      # this job commits.
      - name: Install kustomize
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=v5.5.0
          BASE="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          ASSET="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "/tmp/${ASSET}" "${BASE}/${ASSET}"
          curl -sSfL -o /tmp/kustomize_checksums.txt "${BASE}/checksums.txt"
          expected="$(grep " ${ASSET}\$" /tmp/kustomize_checksums.txt | awk '{print $1}')"
          if [ -z "${expected}" ]; then
            echo "no checksum published for ${ASSET} in ${BASE}/checksums.txt" >&2
            exit 1
          fi
          echo "${expected}  /tmp/${ASSET}" | sha256sum -c -
          tar -xzf "/tmp/${ASSET}" -C "$HOME/.local/bin" kustomize
          chmod +x "$HOME/.local/bin/kustomize"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Digests, not tags. A tag is a mutable pointer; the cluster must roll out
      # the exact bytes this job built and signed, and ArgoCD must be able to
      # tell one revision from the next.
      #
      # Two places, deliberately. `kustomization.yaml` is what a kustomize
      # render reads, and the Deployment manifests are what everything that does
      # not render reads — the Enclii onboarding gate fetches each Deployment
      # raw from GitHub, applies no overlay, and blocks on any image reference
      # that is not `@sha256:`. A digest that exists only in the overlay is a
      # digest that gate never sees, so both are rewritten in the same commit.
      - name: Pin image digests
        working-directory: infra/k8s/production
        # Digests arrive through the environment rather than being interpolated
        # into the script body, so nothing from a step output is ever parsed as
        # shell.
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build-admin.outputs.digest }}
          LANDING_DIGEST: ${{ steps.build-landing.outputs.digest }}
        run: |
          set -euo pipefail

          API_IMAGE=ghcr.io/madfam-org/meridian-api
          WEB_IMAGE=ghcr.io/madfam-org/meridian-web
          ADMIN_IMAGE=ghcr.io/madfam-org/meridian-admin
          # Nested path, unlike the other three. See kustomization.yaml.
          LANDING_IMAGE=ghcr.io/madfam-org/meridian/landing

          kustomize edit set image "${API_IMAGE}=${API_IMAGE}@${API_DIGEST}"
          kustomize edit set image "${WEB_IMAGE}=${WEB_IMAGE}@${WEB_DIGEST}"
          kustomize edit set image "${ADMIN_IMAGE}=${ADMIN_IMAGE}@${ADMIN_DIGEST}"
          kustomize edit set image "${LANDING_IMAGE}=${LANDING_IMAGE}@${LANDING_DIGEST}"

          # Rewrites the one `image:` line in a Deployment, whether it currently
          # holds a tag or an older digest. `[:@]` immediately after the
          # repository name is what stops `meridian-api` from matching inside a
          # longer repository name.
          #
          # The grep afterwards is the point of the function: a sed that matches
          # nothing exits 0, and a silent no-op here ships a manifest still
          # pinned to `:main` behind a green pipeline — exactly the failure this
          # step exists to prevent.
          pin_deployment() {
            file="$1"
            repo="$2"
            digest="$3"
            sed -i -E "s#^([[:space:]]*image: )${repo}[:@][^[:space:]]+#\1${repo}@${digest}#" "$file"
            if ! grep -qF "image: ${repo}@${digest}" "$file"; then
              echo "could not pin ${repo}@${digest} in ${file}." >&2
              echo "expected a line 'image: ${repo}:<tag>' or 'image: ${repo}@sha256:<hex>'; found:" >&2
              grep -n 'image:' "$file" >&2 || true
              exit 1
            fi
            echo "pinned ${file} -> ${repo}@${digest}"
          }

          pin_deployment api-deployment.yaml "${API_IMAGE}" "${API_DIGEST}"
          pin_deployment web-deployment.yaml "${WEB_IMAGE}" "${WEB_DIGEST}"
          pin_deployment admin-deployment.yaml "${ADMIN_IMAGE}" "${ADMIN_DIGEST}"
          pin_deployment landing-deployment.yaml "${LANDING_IMAGE}" "${LANDING_DIGEST}"

      # ArgoCD syncs from this commit. A push authenticated with GITHUB_TOKEN
      # does not start another workflow run, so this cannot loop; `[skip ci]`
      # states the intent for any human reading the history.
      - name: Commit pinned digests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            infra/k8s/production/kustomization.yaml \
            infra/k8s/production/api-deployment.yaml \
            infra/k8s/production/web-deployment.yaml \
            infra/k8s/production/admin-deployment.yaml \
            infra/k8s/production/landing-deployment.yaml
          if ! git diff --staged --quiet; then
            git commit -m "ci: pin image digests for ${GITHUB_SHA} [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "digests unchanged — nothing to commit"
          fi
